name: build-ci-image

# Two publish channels + one gate:
#   push to main -> RELEASE  : :latest, :10, :10-YYYYMMDD, :sha-<commit>
#   push to dev  -> PREVIEW  : :10-dev (moving), :sha-<commit>
#   PR into main -> validate : build + smoke test, no push (gates dev -> main)
# (which tags publish is branch-conditional in the metadata step below.)
# Consuming projects just PULL a pinned tag.
on:
  push:
    branches: [main, dev]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-ci-image.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # lets the built-in GITHUB_TOKEN push to GHCR (no PAT needed)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Only needed to push; skip on PR validation (the base image is public,
      # so pulling/building needs no registry auth).
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kicad-ci
          # Release tags (:latest, :10, :10-YYYYMMDD) only on main; the moving
          # preview tag (:10-dev) only on dev; the immutable :sha-<commit> tag
          # always. On a PR none of the branch conditions match, so nothing but
          # :sha is computed — and the push step is skipped anyway.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=10,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=10-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=10-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha

      # Build once and load into the local docker so the acceptance gates run
      # against the exact image before anything is published. The second build
      # below reuses this build's cache, so the push is near-instant.
      - name: Build image (load for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kicad-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Acceptance criteria 2 & 3: fitz importable by the PATH python, and a
      # real vector overlay (show_pdf_page nests the source as a Form XObject).
      - name: Smoke test — vector PDF overlay (PyMuPDF/fitz)
        run: |
          docker run --rm kicad-ci:test bash -c '
            set -e
            P="$(command -v python3)"; echo "PATH python: $(readlink -f "$P")"
            "$P" - <<PY
          import fitz
          base = fitz.open(); bp = base.new_page(width=595, height=842)
          src  = fitz.open(); sp = src.new_page(width=200, height=200)
          sp.draw_rect(fitz.Rect(10, 10, 190, 190))
          bp.show_pdf_page(fitz.Rect(50, 50, 250, 250), src, 0)  # vector nest, not raster
          base.save("/tmp/out.pdf")
          print("overlay OK, pages:", base.page_count)
          PY'

      # Acceptance criterion 4: base tools still intact.
      - name: Smoke test — base tools intact (kicad-cli, kibot)
        run: |
          docker run --rm kicad-ci:test kicad-cli version
          docker run --rm kicad-ci:test kibot --version

      # Only publish after the gates pass, and only on push/dispatch — never on
      # a PR (dev -> main validation builds and tests, but must not publish).
      # Cached from the build above.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
